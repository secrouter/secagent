[package]
name = "secagent-rust-analyzer"
version = "0.1.0"
edition = "2021"
description = "Convert a rust-analyzer SCIP index into a secagent-analysis/v1 report."

[[bin]]
name = "secagent-rust-analyzer"
path = "src/main.rs"

[dependencies]
scip = "0.5"
protobuf = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
